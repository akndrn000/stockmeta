<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="StockMeta" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04100a"/>
      <stop offset="1" stop-color="#0a2417"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#2bff88" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2bff88" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <g stroke="#2bff88" stroke-opacity="0.05">
    <path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200"/>
    <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300M1000 0V300M1100 0V300"/>
  </g>

  <g font-family="'JetBrains Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">
    <!-- logo -->
    <rect x="70" y="84" width="40" height="40" rx="9" fill="#2bff88"/>
    <text x="130" y="122" font-size="58" font-weight="800" fill="#2bff88" letter-spacing="-2">StockMeta</text>
    <text x="72" y="170" font-size="21" fill="#d6ffe8">Metadata AI untuk Adobe Stock &amp; Shutterstock</text>
    <text x="72" y="199" font-size="15" fill="#7fb59a">Judul, kata kunci, kategori. Batch. Ekspor CSV.</text>

    <!-- chips -->
    <g font-size="14" font-weight="700" fill="#baf5d6">
      <rect x="72" y="222" width="112" height="30" rx="15" fill="#2bff88" fill-opacity="0.08" stroke="#2bff88" stroke-opacity="0.45"/>
      <text x="128" y="242" text-anchor="middle">ADOBE STOCK</text>
      <rect x="194" y="222" width="136" height="30" rx="15" fill="#2bff88" fill-opacity="0.08" stroke="#2bff88" stroke-opacity="0.45"/>
      <text x="262" y="242" text-anchor="middle">SHUTTERSTOCK</text>
      <rect x="340" y="222" width="216" height="30" rx="15" fill="#2bff88" fill-opacity="0.08" stroke="#2bff88" stroke-opacity="0.45"/>
      <text x="448" y="242" text-anchor="middle">TANPA SERVER PERANTARA</text>
    </g>

    <!-- UI card -->
    <rect x="690" y="38" width="440" height="224" rx="14" fill="#06150d" stroke="#2bff88" stroke-opacity="0.45"/>
    <line x1="690" y1="80" x2="1130" y2="80" stroke="#2bff88" stroke-opacity="0.25"/>
    <text x="712" y="66" font-size="14" font-weight="700" fill="#d6ffe8">Lembar caption</text>
    <rect x="1040" y="50" width="70" height="22" rx="11" fill="none" stroke="#2bff88" stroke-opacity="0.6"/>
    <text x="1075" y="65" font-size="11" font-weight="700" fill="#2bff88" text-anchor="middle">[ SIAP ]</text>

    <text x="712" y="106" font-size="11" fill="#7fb59a" letter-spacing="1">JUDUL</text>
    <rect x="712" y="114" width="396" height="30" rx="6" fill="#0a2417" stroke="#2bff88" stroke-opacity="0.3"/>
    <text x="724" y="134" font-size="13" fill="#e9fff3">Golden sunset over layered mountain ridges</text>

    <text x="712" y="168" font-size="11" fill="#7fb59a" letter-spacing="1">KATA KUNCI</text>
    <g font-size="12" fill="#d6ffe8">
      <rect x="712" y="176" width="64" height="24" rx="12" fill="#0a2417" stroke="#2bff88" stroke-opacity="0.35"/><text x="744" y="192" text-anchor="middle">sunset</text>
      <rect x="784" y="176" width="92" height="24" rx="12" fill="#0a2417" stroke="#2bff88" stroke-opacity="0.35"/><text x="830" y="192" text-anchor="middle">mountains</text>
      <rect x="884" y="176" width="104" height="24" rx="12" fill="#0a2417" stroke="#2bff88" stroke-opacity="0.35"/><text x="936" y="192" text-anchor="middle">golden hour</text>
      <rect x="996" y="176" width="64" height="24" rx="12" fill="#0a2417" stroke="#2bff88" stroke-opacity="0.35"/><text x="1028" y="192" text-anchor="middle">+17</text>
    </g>

    <rect x="712" y="216" width="132" height="32" rx="7" fill="#2bff88"/>
    <text x="778" y="237" font-size="13" font-weight="800" fill="#032012" text-anchor="middle">Export CSV</text>
    <rect x="1002" y="220" width="106" height="24" rx="12" fill="none" stroke="#2bff88" stroke-opacity="0.35"/>
    <text x="1055" y="236" font-size="11" font-weight="700" fill="#7fb59a" text-anchor="middle">3 BARIS</text>
  </g>
</svg>
