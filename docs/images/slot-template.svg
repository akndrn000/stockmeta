<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 452" width="1280" height="452" role="img" aria-labelledby="t d" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><title id="t">Cara template universal mengisi slot</title><desc id="d">Contoh Hat dengan empat ID menambah satu baris baru; contoh Face dengan dua ID menyisakan lima slot bernilai nol.</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#2a2a2a"/></pattern></defs><rect x="1.5" y="1.5" width="1277" height="449" rx="16" fill="#121212"/><rect x="1.5" y="1.5" width="1277" height="449" rx="16" fill="url(#dots)"/><rect x="1.5" y="1.5" width="1277" height="449" rx="16" fill="none" stroke="#2a2a2a" stroke-width="3"/><rect x="50" y="36" width="576" height="366" rx="14" fill="#ffd60a"/><rect x="44" y="30" width="576" height="366" rx="14" fill="#1c1c1c"/><rect x="45.5" y="31.5" width="573" height="44" rx="12" fill="#ffd60a"/><rect x="45.5" y="60" width="573" height="16" fill="#ffd60a"/><rect x="44" y="30" width="576" height="366" rx="14" fill="none" stroke="#f5f0e6" stroke-width="3"/><path d="M66 44 L57 52 L66 60 M78 44 L87 52 L78 60" fill="none" stroke="#111111" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="58" font-size="15" font-weight="800" fill="#111111" text-anchor="start" >Hat · 3 slot</text><text x="66" y="104" font-size="13" font-weight="500" fill="#b9b2a3" text-anchor="start" >ID masuk: 101, 102, 103, 104</text><rect x="64" y="120" width="536" height="28" rx="7" fill="#242424" stroke="#ffd60a" stroke-width="2"/><text x="78" y="139" font-size="13" font-weight="600" fill="#f5f0e6" text-anchor="start" >{ AssetId = 101, AccessoryType = "Hat" },</text><rect x="64" y="154" width="536" height="28" rx="7" fill="#242424" stroke="#ffd60a" stroke-width="2"/><text x="78" y="173" font-size="13" font-weight="600" fill="#f5f0e6" text-anchor="start" >{ AssetId = 102, Accesso