<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 290" width="1280" height="290" role="img" aria-labelledby="t d" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><title id="t">Data never passes through a RigForge server</title><desc id="d">Data is processed in the browser. The Lua output is copied and pasted manually into Roblox Studio. The RigForge server receives no data.</desc><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#2a2a2a"/></pattern></defs><rect x="1.5" y="1.5" width="1277" height="287" rx="16" fill="#121212"/><rect x="1.5" y="1.5" width="1277" height="287" rx="16" fill="url(#dots)"/><rect x="1.5" y="1.5" width="1277" height="287" rx="16" fill="none" stroke="#2a2a2a" stroke-width="3"/><rect x="66" y="42" width="440" height="142" rx="14" fill="#ff8fcb"/><rect x="60" y="36" width="440" height="142" rx="14" fill="#1c1c1c"/><rect x="61.5" y="37.5" width="437" height="44" rx="12" fill="#ff8fcb"/><rect x="61.5" y="66" width="437" height="16" fill="#ff8fcb"/><rect x="60" y="36" width="440" height="142" rx="14" fill="none" stroke="#f5f0e6" stroke-width="3"/><path d="M82 50 L73 58 L82 66 M94 50 L103 58 L94 66" fill="none" stroke="#111111" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="64" font-size="15" font-weight="800" fill="#111111" text-anchor="start" >Your browser</text><text x="84" y="100" font-size="14" font-weight="500" fill="#b9b2a3" text-anchor="start" >Raw data is processed locally</text><text x="84" y="128" font-size="14" font-weight="500" fill="#b9b2a3" text-anchor="start" >Only the theme choice in localStorage</text><text x="84" y="156" font-size="14" font-weight="500" fill="#b9b2a3" text-anchor="start" >Self-hosted fonts, no trackers</text><rect x="786" y="42" width="440" height="142" rx="14" fill="#7cf2b4"/><rect x="780" y="36" width="440" height="142" rx="14" fill="#1c1c1c"/><rect x="781.5" y="37.5" width="437" height="44" rx="12" fill="#7cf2b4"/><rect x="781.5" y="66" width="437" height="16" fill="#7cf2b4"/><rect x="780" y="36" width="440" height="142" rx="14" fill="none" stroke="#f5f0e6" stroke-width="3"/><path d="M802 50 L793 58 L802 66 M814 50 L823 58 L814 66" fill="none" stroke="#111111" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="834" y="64" font-size="15" font-weight="800" fill="#111111" text-anchor="start" >Roblox Studio</text><text x="804" y="100" font-size="14" font-weight="500" fill="#b9b2a3" text-anchor="start" >You paste the Lua output yourself</text><text x="804" y="128" font-size="14" font-weight="500" fill="#b9b2a3" text-anchor="start" >No automatic uploads from</text><text x="804" y="156" font-size="14" font-weight="500" fill="#b9b2a3" text-anchor="start" >RigForge to anywhere</text><text x="640" y="104" font-size="13" font-weight="600" fill="#7cf2b4" text-anchor="middle" >Copy code, paste manually</text><path d="M512 118 H768 M757 109 L768 118 L757 127" fill="none" stroke="#7cf2b4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="500" y="208" width="280" height="58" rx="14" fill="none" stroke="#6f6a60" stroke-width="2" stroke-dasharray="8 6"/><text x="640" y="233" font-size="15" font-weight="700" fill="#b9b2a3" text-anchor="middle" >RigForge server</text><text x="640" y="253" font-size="12.5" font-weight="500" fill="#6f6a60" text-anchor="middle" >receives no data</text></svg>